name: E2E PR Test

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
    branches:
    - 'main'
    - 'release-1.14'
    paths-ignore:
    - '**/*.md'
    - 'docs/**'
    - '.gitignore'
    - 'LICENSE'
    - 'SECURITY_CONTACTS'
    - 'DCO'
    - 'OWNERS'
    - 'OWNERS_ALIASES'

permissions: {}

jobs:
  e2e:
    uses: $/.github/workflows/e2e-test.yml
